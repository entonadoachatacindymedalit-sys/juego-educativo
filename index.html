        .badge-ob2 { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.4); }
        .badge-ob3 { background: rgba(192, 132, 252, 0.15); color: #c084fc; border: 1px solid rgba(192, 132, 252, 0.4); }

<body>

    <main>
        <!-- Cabecera Institucional UNSAAC -->
        <header class="card-header">
            <h1 class="univ-title">
                UNIVERSIDAD NACIONAL DE SAN ANTONIO ABAD DEL CUSCO
            </h1>
            
            <div class="dept-container">
                <div class="school-tag">
                    <!-- Icono de Obstetricia SVG -->
                    <svg class="icon-svg" viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
                    </svg>
                    <span>Escuela Profesional de Obstetricia</span>
                </div>
                
                <!-- Nombre de la Estudiante -->
                <div class="author-badge">
                    <!-- Icono Graduado SVG -->
                    <svg class="icon-svg" viewBox="0 0 24 24">
                        <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"></path>
                    </svg>
                    <span>CINDY MEDALIT ENTONADO ACHATA</span>
                </div>

                <!-- Indicador y Botón de Descarga Offline -->
                <div class="offline-badge">
                    <svg class="icon-svg" viewBox="0 0 24 24" style="width:0.85rem; height:0.85rem;">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"></path>
                    </svg>
                    <span>100% Offline · Gratis / Sin Internet</span>
                </div>

                <!-- Botón de Descarga Directa para Guardar el Archivo -->
                <button type="button" onclick="descargarAppOffline()" class="download-btn-top" title="Descargar esta Calculadora para usarla sin Internet">
                    <svg class="icon-svg" viewBox="0 0 24 24" style="width:1rem; height:1rem;">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"></path>
                    </svg>
                    <span>Guardar / Descargar App (.html)</span>
                </button>
            </div>
        </header>

        <!-- Tarjeta Principal de la Calculadora -->
        <section class="card-body">
            <div class="calc-header">
                <div class="calc-icon-box">
                    <svg class="icon-svg" viewBox="0 0 24 24" style="width: 1.5rem; height: 1.5rem;">
                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"></path>
                    </svg>
                </div>
                <h2 class="calc-title">Calculadora de IMC</h2>
                <p class="calc-subtitle">Diagnóstico según algoritmo de salud</p>
            </div>

            <form id="imcForm" onsubmit="event.preventDefault(); calcularIMC();">
                <!-- Campo Peso -->
                <div class="form-group">
                    <div class="form-label-container">
                        <label for="peso" class="form-label">Peso (kg)</label>
                    </div>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <!-- Icono Peso SVG -->
                            <svg class="icon-svg" viewBox="0 0 24 24">
                                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3zm6 12H6v-1c0-2 4-3.1 6-3.1s6 1.1 6 3.1v1z"></path>
                            </svg>
                        </div>
                        <input type="number" step="0.1" min="1" max="300" id="peso" placeholder="Ej. 70" class="custom-input" required="">
                        <span class="input-unit">kg</span>
                    </div>
                </div>

                <!-- Campo Talla -->
                <div class="form-group">
                    <div class="form-label-container">
                        <label for="talla" class="form-label">Talla / Estatura</label>
                        <div class="unit-switch">
                            <button type="button" id="unitM" onclick="setUnidad('m')" class="unit-btn active">Metros (m)</button>
                            <button type="button" id="unitCm" onclick="setUnidad('cm')" class="unit-btn">cm</button>
                        </div>
                    </div>
                    <div class="input-wrapper">
                        <div class="input-icon">
                            <!-- Icono Regla SVG -->
                            <svg class="icon-svg" viewBox="0 0 24 24">
                                <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H3V8h2v4h2V8h2v2h2V8h2v4h2V8h2v2h2V8h2v8z"></path>
                            </svg>
                        </div>
                        <input type="number" step="0.01" min="0.5" max="2.5" id="talla" placeholder="Ej. 1.70" class="custom-input" required="">
                        <span class="input-unit" id="unitLabel">m</span>
                    </div>
                </div>

                <!-- Botones -->
                <div class="btn-group">
                    <button type="submit" class="btn-calc">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <path d="M7 2v11h3v9l7-12h-4l4-8z"></path>
                        </svg>
                        Calcular IMC
                    </button>
                    <button type="button" onclick="limpiarFormulario()" class="btn-reset" title="Limpiar">
                        <svg class="icon-svg" viewBox="0 0 24 24">
                            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"></path>
                        </svg>
                    </button>
                </div>
            </form>

            <!-- Resumen de Resultado -->
            <div id="resultCard" class="result-container">
                <span class="res-label">Resultado del Diagnóstico</span>
                <div class="res-value-group">
                    <span id="resImcVal" class="res-val">0.0</span>
                    <span class="res-unit">kg/m²</span>
                </div>

                <div id="resBadge" class="res-badge">
                    <span id="resCategoria">---</span>
                </div>

                <div class="res-formula">
                    <p id="resFormula">IMC = peso / (talla * talla)</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        let unidadEstatura = 'm';

        function setUnidad(unit) {
            unidadEstatura = unit;
            const btnM = document.getElementById('unitM');
            const btnCm = document.getElementById('unitCm');
            const label = document.getElementById('unitLabel');
            const inputTalla = document.getElementById('talla');

            if (unit === 'm') {
                btnM.classList.add('active');
                btnCm.classList.remove('active');
                label.textContent = "m";
                inputTalla.placeholder = "Ej. 1.70";
                inputTalla.step = "0.01";
                inputTalla.min = "0.5";
                inputTalla.max = "2.5";
                if (inputTalla.value && parseFloat(inputTalla.value) > 10) {
                    inputTalla.value = (parseFloat(inputTalla.value) / 100).toFixed(2);
                }
            } else {
                btnCm.classList.add('active');
                btnM.classList.remove('active');
                label.textContent = "cm";
                inputTalla.placeholder = "Ej. 170";
                inputTalla.step = "1";
                inputTalla.min = "50";
                inputTalla.max = "250";
                if (inputTalla.value && parseFloat(inputTalla.value) < 10) {
                    inputTalla.value = Math.round(parseFloat(inputTalla.value) * 100);
                }
            }
        }

        function calcularIMC() {
            const pesoInput = parseFloat(document.getElementById('peso').value);
            let tallaInput = parseFloat(document.getElementById('talla').value);

            if (isNaN(pesoInput) || isNaN(tallaInput) || pesoInput <= 0 || tallaInput <= 0) {
                return;
            }

            let tallaMetros = unidadEstatura === 'cm' ? tallaInput / 100 : tallaInput;

            // Algoritmo exacto según el diagrama: IMC = peso / (talla * talla)
            const imc = pesoInput / (tallaMetros * tallaMetros);
            const imcFormatted = imc.toFixed(2);

            let diagnosticoText = "";
            let badgeClass = "";

            /* 
               Evaluación condicional estricta del diagrama de flujo:
               1. IMC < 18.5 -> "Bajo peso"
               2. IMC < 25   -> "Peso normal"
               3. IMC < 30   -> "Sobrepeso"
               4. IMC < 35   -> "Obesidad tipo 1"
               5. IMC < 40   -> "Obesi tipo 2"
               6. Else       -> "obesi tipo 3"
            */

            if (imc < 18.5) {
                diagnosticoText = "Bajo peso";
                badgeClass = "badge-bajo";
            } else if (imc < 25) {
                diagnosticoText = "Peso normal";
                badgeClass = "badge-normal";
            } else if (imc < 30) {
                diagnosticoText = "Sobrepeso";
                badgeClass = "badge-sobrepeso";
            } else if (imc < 35) {
                diagnosticoText = "Obesidad tipo 1";
                badgeClass = "badge-ob1";
            } else if (imc < 40) {
                diagnosticoText = "Obesi tipo 2";
                badgeClass = "badge-ob2";
            } else {
                diagnosticoText = "obesi tipo 3";
                badgeClass = "badge-ob3";
            }

            // Mostrar Resultados
            const resultCard = document.getElementById('resultCard');
            resultCard.classList.add('active');

            document.getElementById('resImcVal').textContent = imcFormatted;
            
            const badge = document.getElementById('resBadge');
            badge.className = `res-badge ${badgeClass}`;
            document.getElementById('resCategoria').textContent = diagnosticoText;

            document.getElementById('resFormula').textContent = 
                `IMC = ${pesoInput} / (${tallaMetros.toFixed(2)} * ${tallaMetros.toFixed(2)}) = ${imcFormatted}`;
        }

        function limpiarFormulario() {
            document.getElementById('imcForm').reset();
            const resultCard = document.getElementById('resultCard');
            resultCard.classList.remove('active');
        }

        // Función para descargar el archivo HTML completo y ejecutarlo 100% Offline
        function descargarAppOffline() {
            const documentContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([documentContent], { type: 'text/html;charset=utf-8' });
            const downloadUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = 'Calculadora_IMC_UNSAAC_Obstetricia.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(downloadUrl);
        }
    </script>

</body></html>
